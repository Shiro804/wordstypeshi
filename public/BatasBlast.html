<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BatasBlast Background</title>
  <style>
    :root{
      --bg: #2d3748;
      --duck: #FFD86B;
      --duck-belly: #FFF3C9;
      --beak: #FF8B4A;
      --eye: #1E2430;
      --text: #F6AD55;
      --accent: #ED8936;
    }

    html, body {
      height: 100%;
      margin: 0;
      background: linear-gradient(135deg, #1a202c 0%, #2d3748 50%, #1a202c 100%);
      overflow: hidden;
    }

    .bg {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
    }

    .logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(10px, 2.2vw, 18px);
      transform: translateZ(0);
    }

    .duckWrap {
      width: clamp(180px, 26vw, 340px);
      height: auto;
      filter: drop-shadow(0 10px 0 rgba(0,0,0,0.15));
    }

    .title {
      font-family: ui-rounded, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      font-weight: 900;
      letter-spacing: 0.02em;
      font-size: clamp(34px, 5vw, 72px);
      background: linear-gradient(135deg, var(--text) 0%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      text-align: center;
      text-shadow: 0 6px 0 rgba(0,0,0,0.1);
      user-select: none;
    }

    /* Grid pattern overlay */
    .grid-pattern {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 40px 40px;
      opacity: 0.5;
    }

    /* Floating blocks animation */
    .floating-blocks {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    .block {
      position: absolute;
      border-radius: 6px;
      opacity: 0.15;
      animation: float 20s ease-in-out infinite;
    }

    .block:nth-child(1) { width: 40px; height: 40px; background: var(--accent); top: 10%; left: 5%; animation-delay: 0s; }
    .block:nth-child(2) { width: 80px; height: 40px; background: var(--text); top: 20%; right: 10%; animation-delay: -5s; }
    .block:nth-child(3) { width: 40px; height: 80px; background: var(--accent); bottom: 15%; left: 15%; animation-delay: -10s; }
    .block:nth-child(4) { width: 80px; height: 80px; background: var(--text); top: 60%; right: 5%; animation-delay: -15s; }
    .block:nth-child(5) { width: 40px; height: 40px; background: var(--accent); bottom: 30%; right: 20%; animation-delay: -3s; }
    .block:nth-child(6) { width: 120px; height: 40px; background: var(--text); top: 40%; left: 2%; animation-delay: -8s; }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.15; }
      50% { transform: translateY(-20px) rotate(5deg); opacity: 0.25; }
    }

    .duck {
      transform-origin: center;
      animation: bob 2.7s ease-in-out infinite;
    }

    .wing, .eyeL, .eyeR, .spark {
      transform-box: fill-box;
      transform-origin: center;
    }

    .wing {
      transform-origin: 25% 55%;
      animation: flap 1.35s ease-in-out infinite;
    }

    .eyeL, .eyeR {
      animation: blink 4.6s infinite;
    }

    .spark {
      transform-origin: center;
      animation: pop 3.8s ease-in-out infinite;
      opacity: 0.9;
    }

    @keyframes bob {
      0%, 100% { transform: translateY(0) rotate(-1deg); }
      50%      { transform: translateY(-10px) rotate(1deg); }
    }

    @keyframes flap {
      0%, 100% { transform: rotate(0deg) translateY(0); }
      50%      { transform: rotate(-12deg) translateY(-2px); }
    }

    @keyframes blink {
      0%, 6%, 100% { transform: scaleY(1); }
      2%           { transform: scaleY(0.12); }
      4%           { transform: scaleY(1); }
      70%          { transform: scaleY(1); }
      72%          { transform: scaleY(0.12); }
      74%          { transform: scaleY(1); }
    }

    @keyframes pop {
      0%, 100% { transform: translateY(0) scale(1); }
      50%      { transform: translateY(-4px) scale(1.03); }
    }

    @media (prefers-reduced-motion: reduce) {
      .duck, .wing, .eyeL, .eyeR, .spark, .block { animation: none !important; }
    }
  </style>
</head>

<body>
  <!-- Floating blocks background -->
  <div class="floating-blocks" aria-hidden="true">
    <div class="block"></div>
    <div class="block"></div>
    <div class="block"></div>
    <div class="block"></div>
    <div class="block"></div>
    <div class="block"></div>
  </div>

  <!-- Grid pattern -->
  <div class="grid-pattern" aria-hidden="true"></div>

  <div class="bg" aria-hidden="true">
    <div class="logo">
      <!-- Text -->
      <div class="title">BatasBlast</div>

      <!-- Duck mascot -->
      <svg class="duckWrap" viewBox="0 0 320 320" role="img" aria-label="Cute duck mascot">
        <g class="duck">
          <!-- tiny sparkle -->
          <g class="spark">
            <path d="M252 62c6 10 6 22 0 32c-10 6-22 6-32 0c-6-10-6-22 0-32c10-6 22-6 32 0z"
                  fill="rgba(255,255,255,0.75)"/>
          </g>

          <!-- body -->
          <ellipse cx="160" cy="192" rx="118" ry="88" fill="var(--duck)"/>
          <!-- belly -->
          <ellipse cx="160" cy="210" rx="68" ry="52" fill="var(--duck-belly)"/>

          <!-- head -->
          <circle cx="160" cy="120" r="72" fill="var(--duck)"/>

          <!-- wing (animated) -->
          <g class="wing">
            <ellipse cx="86" cy="198" rx="44" ry="34" fill="rgba(0,0,0,0.06)"/>
            <ellipse cx="92" cy="190" rx="48" ry="36" fill="var(--duck)"/>
            <ellipse cx="105" cy="194" rx="28" ry="22" fill="var(--duck-belly)"/>
          </g>

          <!-- beak -->
          <path d="M160 140
                   c26 0 44 10 44 24
                   c0 14-18 24-44 24
                   c-26 0-44-10-44-24
                   c0-14 18-24 44-24z"
                fill="var(--beak)"/>

          <!-- cheeks -->
          <circle cx="120" cy="158" r="10" fill="rgba(255,120,150,0.18)"/>
          <circle cx="200" cy="158" r="10" fill="rgba(255,120,150,0.18)"/>

          <!-- eyes -->
          <g class="eyeL">
            <circle cx="136" cy="118" r="10" fill="var(--eye)"/>
            <circle cx="132" cy="114" r="3.2" fill="rgba(255,255,255,0.9)"/>
          </g>

          <g class="eyeR">
            <circle cx="184" cy="118" r="10" fill="var(--eye)"/>
            <circle cx="180" cy="114" r="3.2" fill="rgba(255,255,255,0.9)"/>
          </g>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
